name: keychain

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - name: Store the app keys as a repository secret
        env:
          GH_TOKEN: ${{ vars.MIRROR_TOKEN }}
          KEYPAYLOAD: ${{ vars.KEYPAYLOAD }}
        run: |
          set -e
          gh secret set LOCAL_PROPERTIES --repo "$GITHUB_REPOSITORY" --body "$KEYPAYLOAD"
          gh secret list --repo "$GITHUB_REPOSITORY"
