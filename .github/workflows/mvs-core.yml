name: mvs-core audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: List sources
        run: |
          cd mvs-core
          find src test -name '*.java' | sort | tee all-sources.txt
          echo "count: $(wc -l < all-sources.txt)"

      - name: Compile core sources (audit part 1)
        id: core
        run: |
          cd mvs-core
          rm -rf out && mkdir -p out
          find src -name '*.java' | sort > core-sources.txt
          javac -Xlint:all -encoding UTF-8 -d out @core-sources.txt 2>&1 | tee core-javac.log

      - name: Compile tests as delivered (expected to fail on sDir)
        id: tests
        continue-on-error: true
        run: |
          cd mvs-core
          rm -rf out-all && mkdir -p out-all
          javac -encoding UTF-8 -d out-all @all-sources.txt 2>&1 | tee tests-javac.log

      - name: Run RegressionTest when tests compile
        if: steps.tests.outcome == 'success'
        run: |
          cd mvs-core
          java -cp out-all app.mvs.core.RegressionTest

      - name: Summary
        if: always()
        run: |
          echo "core compile : ${{ steps.core.outcome }}"
          echo "tests compile: ${{ steps.tests.outcome }}"
          echo "----- tests-javac.log -----"
          cat mvs-core/tests-javac.log || true
